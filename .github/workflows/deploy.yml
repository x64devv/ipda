# Deploy the ipda live loop + management plane to the Linux server.
#
# Actions does NOT run the loop — it tests, builds BOTH Docker images (engine
# + manager), pushes them to GHCR, then SSHes to the server, pulls, and
# restarts the MANAGER only. Running engine containers keep their current
# image until you press Restart per deployment in the manager UI — no
# surprise mid-trade engine swaps.
#
# Repository secrets required:
#   DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY / DEPLOY_PORT (optional)
#
# Trigger: manual. Uncomment the push trigger to automate deliberately.

name: deploy-live-loop

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Engine unit tests (network-free)
        working-directory: ipda
        run: ./gradlew --no-daemon test
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: ipda/build/reports/tests/test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GHCR image names must be lowercase; usernames may not be.
      - name: Compute image names
        run: |
          echo "ENGINE_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ipda-live" >> "$GITHUB_ENV"
          echo "MANAGER_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ipda-manager" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push engine image
        uses: docker/build-push-action@v6
        with:
          context: ipda
          push: true
          tags: |
            ${{ env.ENGINE_IMAGE }}:latest
            ${{ env.ENGINE_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=engine
          cache-to: type=gha,mode=max,scope=engine
      - name: Build and push manager image
        uses: docker/build-push-action@v6
        with:
          context: manager
          push: true
          tags: |
            ${{ env.MANAGER_IMAGE }}:latest
            ${{ env.MANAGER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=manager
          cache-to: type=gha,mode=max,scope=manager

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Compute image names
        run: echo "ENGINE_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ipda-live" >> "$GITHUB_ENV"
      - name: Pull images and restart the manager on the server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: GHCR_TOKEN,GHCR_USER,ENGINE_IMAGE
          script_stop: true
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd /opt/ipda
            docker compose pull
            docker pull "$ENGINE_IMAGE:latest"
            docker compose up -d
            docker logout ghcr.io
            sleep 3
            docker compose ps
            echo "Running engine containers (restart from the manager UI to apply the new engine image):"
            docker ps --filter "name=ipda-" --format "  {{.Names}}  {{.Image}}  {{.Status}}"
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          ENGINE_IMAGE: ${{ env.ENGINE_IMAGE }}
